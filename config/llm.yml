providers:
  openai:
    display_name: 'OpenAI'
    enabled: true
  gemini:
    display_name: 'Google Gemini'
    enabled: true
  deepseek:
    display_name: 'DeepSeek'
    enabled: true
  anthropic:
    display_name: 'Anthropic'
    enabled: false
  mistral:
    display_name: 'Mistral'
    enabled: false
  groq:
    display_name: 'Groq'
    enabled: false
  perplexity:
    display_name: 'Perplexity'
    enabled: false
  openrouter:
    display_name: 'OpenRouter'
    enabled: false
  ollama:
    display_name: 'Ollama (local)'
    enabled: false
  azure_openai:
    display_name: 'Azure OpenAI'
    enabled: false
  tavily:
    display_name: 'Tavily Search'
    enabled: false
  custom:
    display_name: 'Custom (OpenAI-compatible)'
    enabled: false

models:
  gpt-4.1:
    provider: openai
    display_name: 'GPT-4.1'
    credit_multiplier: 3
  gpt-4.1-mini:
    provider: openai
    display_name: 'GPT-4.1 Mini'
    credit_multiplier: 1
  gpt-4.1-nano:
    provider: openai
    display_name: 'GPT-4.1 Nano'
    credit_multiplier: 1
  gpt-5.1:
    provider: openai
    display_name: 'GPT-5.1'
    credit_multiplier: 2
  gpt-5-mini:
    provider: openai
    display_name: 'GPT-5 Mini'
    credit_multiplier: 1
  gpt-5-nano:
    provider: openai
    display_name: 'GPT-5 Nano'
    credit_multiplier: 1
  gpt-5.2:
    provider: openai
    display_name: 'GPT-5.2'
    credit_multiplier: 3
  claude-haiku-4.5:
    provider: anthropic
    display_name: 'Claude Haiku 4.5'
    coming_soon: true
    credit_multiplier: 2
  claude-sonnet-4.5:
    provider: anthropic
    display_name: 'Claude Sonnet 4.5'
    coming_soon: true
    credit_multiplier: 3
  # Google's current stable Gemini line. gemini-3-pro-preview used to be listed
  # here and Google has shut it down — see Llm::Models::RETIRED_MODEL_ALIASES,
  # which reroutes accounts that still store it.
  gemini-3.5-flash:
    provider: gemini
    display_name: 'Gemini 3.5 Flash'
    credit_multiplier: 1
  gemini-3.1-flash-lite:
    provider: gemini
    display_name: 'Gemini 3.1 Flash Lite'
    credit_multiplier: 1
  gemini-3.1-pro-preview:
    provider: gemini
    display_name: 'Gemini 3.1 Pro'
    credit_multiplier: 3
  # Still served by Google, kept for accounts already pointing at it.
  gemini-3-flash-preview:
    provider: gemini
    display_name: 'Gemini 3 Flash'
    credit_multiplier: 1
  deepseek-v4-flash:
    provider: deepseek
    display_name: 'DeepSeek V4 Flash'
    credit_multiplier: 1
  deepseek-v4-pro:
    provider: deepseek
    display_name: 'DeepSeek V4 Pro'
    credit_multiplier: 2
  whisper-1:
    provider: openai
    display_name: 'Whisper'
    credit_multiplier: 1
  text-embedding-3-small:
    provider: openai
    display_name: 'Text Embedding 3 Small'
    credit_multiplier: 1
  gemini-embedding-001:
    provider: gemini
    display_name: 'Gemini Embedding 001'
    credit_multiplier: 1

features:
  editor:
    models:
      [
        gpt-4.1-mini,
        gpt-4.1-nano,
        gpt-5-mini,
        gpt-4.1,
        gpt-5.1,
        gpt-5.2,
        gemini-3.5-flash,
        gemini-3.1-flash-lite,
        gemini-3-flash-preview,
        gemini-3.1-pro-preview,
        deepseek-v4-flash,
        deepseek-v4-pro,
      ]
    default: gpt-4.1-mini
  assistant:
    models:
      [
        gpt-5-mini,
        gpt-4.1,
        gpt-5.1,
        gpt-5.2,
        gemini-3.5-flash,
        gemini-3.1-flash-lite,
        gemini-3-flash-preview,
        gemini-3.1-pro-preview,
        deepseek-v4-flash,
        deepseek-v4-pro,
      ]
    default: gpt-5.1
  copilot:
    models:
      [
        gpt-5-mini,
        gpt-4.1,
        gpt-5.1,
        gpt-5.2,
        gemini-3.5-flash,
        gemini-3.1-flash-lite,
        gemini-3-flash-preview,
        gemini-3.1-pro-preview,
        deepseek-v4-flash,
        deepseek-v4-pro,
      ]
    default: gpt-5.1
  label_suggestion:
    models:
      [gpt-4.1-nano, gpt-4.1-mini, gpt-5-mini, gemini-3.1-flash-lite, gemini-3-flash-preview, deepseek-v4-flash]
    default: gpt-4.1-nano
  audio_transcription:
    models: [whisper-1]
    default: whisper-1
  help_center_search:
    models: [text-embedding-3-small, gemini-embedding-001]
    default: text-embedding-3-small
  document_faq:
    models:
      [
        gpt-4.1-mini,
        gpt-4.1,
        gpt-5-mini,
        gpt-5.1,
        gemini-3.5-flash,
        gemini-3.1-flash-lite,
        gemini-3-flash-preview,
        gemini-3.1-pro-preview,
        deepseek-v4-flash,
        deepseek-v4-pro,
      ]
    default: gpt-4.1-mini
