# Coolify deployment compose for Chatwoot Adaki
# Deploys: rails (web), sidekiq (workers), postgres (pgvector), redis
# Uses pre-built image from GHCR — see .github/workflows/build-image.yml
#
# Coolify setup:
#   - Resource type: Docker Compose
#   - Compose file: docker-compose.coolify.yaml
#   - Set env vars via Coolify UI (see .env.coolify.example)
#   - Map domain to "rails" service, port 3000
#
# Migration strategy:
#   The "rails" container runs `rails db:chatwoot_prepare` on each boot
#   (idempotent: schema-load + seed on first run, migrate on subsequent).
#   "sidekiq" starts after the main services are up.
#
# Required env vars (set in Coolify UI):
#   GHCR_IMAGE, SECRET_KEY_BASE, FRONTEND_URL, POSTGRES_PASSWORD,
#   REDIS_PASSWORD, MAILER_SENDER_EMAIL, SMTP_*,
#   ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY, ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY,
#   ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT

x-base: &base
  image: ${GHCR_IMAGE:-ghcr.io/CHANGE_ME/chatwoot-adaki:latest}
  pull_policy: always
  env_file:
    - .env
  environment:
    - NODE_ENV=production
    - RAILS_ENV=production
    - INSTALLATION_ENV=docker
    - RAILS_LOG_TO_STDOUT=true
    - POSTGRES_HOST=postgres
    - POSTGRES_PORT=5432
    - POSTGRES_USERNAME=postgres
    - POSTGRES_DATABASE=chatwoot
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    - SERVICE_FQDN_RAILS_3000
  volumes:
    - storage_data:/app/storage
    - backup_data:/var/backups/adaki
  restart: unless-stopped

services:
  rails:
    <<: *base
    depends_on:
      - postgres
      - redis
    expose:
      - '3000'
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    labels:
      - coolify.managed=true

  sidekiq:
    <<: *base
    depends_on:
      - postgres
      - redis
      - rails
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - RAILS_LOG_TO_STDOUT=true
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USERNAME=postgres
      - POSTGRES_DATABASE=chatwoot
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - SKIP_DB_PREPARE=true
    entrypoint: docker/entrypoints/rails.sh
    command:
      [
        'sh',
        '-c',
        'bundle exec sidekiq -C config/sidekiq.yml'
      ]

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:alpine
    restart: unless-stopped
    command: ['sh', '-c', 'redis-server --requirepass "$$REDIS_PASSWORD"']
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data

  backup:
    <<: *base
    profiles: ['backup']
    depends_on:
      - postgres
    entrypoint: ['/bin/sh', '-c']
    command: ['while true; do sleep 86400; bin/adaki-backup.sh; done']
    environment:
      - RAILS_ENV=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USERNAME=postgres
      - POSTGRES_DATABASE=chatwoot
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/chatwoot
      - BACKUP_DIR=/var/backups/adaki
      - RETENTION_DAYS=30

volumes:
  storage_data:
  postgres_data:
  redis_data:
  backup_data:
