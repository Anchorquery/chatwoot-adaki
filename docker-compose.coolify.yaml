# Coolify deployment compose for Chatwoot Adaki
# Deploys: rails (web), sidekiq (workers), postgres (pgvector), redis
# Uses pre-built image from GHCR — see .github/workflows/build-image.yml
#
# Coolify setup:
#   - Resource type: Docker Compose
#   - Compose file: docker-compose.coolify.yaml
#   - Set env vars via Coolify UI (see .env.coolify.example)
#   - Map domain to "rails" service, port 3000
#
# Required env vars (set in Coolify UI):
#   GHCR_IMAGE, SECRET_KEY_BASE, FRONTEND_URL, POSTGRES_PASSWORD,
#   REDIS_PASSWORD, MAILER_SENDER_EMAIL, SMTP_*,
#   ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY, ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY,
#   ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT

services:
  base: &base
    image: ${GHCR_IMAGE:-ghcr.io/CHANGE_ME/chatwoot-adaki:latest}
    pull_policy: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - RAILS_LOG_TO_STDOUT=true
      - POSTGRES_HOST=postgres
      - POSTGRES_USERNAME=postgres
      - POSTGRES_DATABASE=chatwoot
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    volumes:
      - storage_data:/app/storage
    restart: unless-stopped

  rails:
    <<: *base
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '3000'
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    labels:
      - coolify.managed=true
      - coolify.type=service
      # Coolify auto-detects port 3000 for proxy

  sidekiq:
    <<: *base
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    healthcheck:
      test: ['CMD-SHELL', "ps -ef | grep '[s]idekiq' | grep -v grep || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d chatwoot']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    restart: unless-stopped
    command: ['sh', '-c', 'redis-server --requirepass "$$REDIS_PASSWORD"']
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  storage_data:
  postgres_data:
  redis_data:
