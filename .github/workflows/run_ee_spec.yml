name: Run Chatwoot EE spec
permissions:
  contents: read
on:
  push:
    branches:
      - develop
      - master
  pull_request:
  workflow_dispatch:

# Mirrors run_foss_spec.yml's backend-tests job, minus the "Strip enterprise
# code" step — this is the workflow FOR spec/enterprise/, which run_foss_spec.yml
# deliberately never touches (see docs/adaki/captain-limits.md "Gap conocido").
# Scoped to spec/enterprise only: the FOSS suite is already covered by
# run_foss_spec.yml, so re-running it here would just burn CI minutes for no
# new signal on those files.
jobs:
  enterprise-backend-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ci_node_total: [8]
        ci_node_index: [0, 1, 2, 3, 4, 5, 6, 7]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --entrypoint redis-server

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install pnpm dependencies
        run: pnpm i

      - name: Build Vite assets for test
        run: RAILS_ENV=test bin/vite build --mode=test
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Create database
        run: bundle exec rake db:create

      - name: Seed database
        run: bundle exec rake db:schema:load

      - name: Run enterprise backend tests (parallelized)
        run: |
          SPEC_FILES=($(find spec/enterprise -name '*_spec.rb' | sort))
          TESTS=""

          for i in "${!SPEC_FILES[@]}"; do
            if [ $(( i % ${{ matrix.ci_node_total }} )) -eq ${{ matrix.ci_node_index }} ]; then
              TESTS="$TESTS ${SPEC_FILES[$i]}"
            fi
          done

          if [ -n "$TESTS" ]; then
            bundle exec rspec --profile=10 --format progress --format json --out tmp/rspec_results.json $TESTS
          fi
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rspec-ee-results-${{ matrix.ci_node_index }}
          path: tmp/rspec_results.json

      - name: Upload rails log folder
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rails-ee-log-folder-${{ matrix.ci_node_index }}
          path: log
